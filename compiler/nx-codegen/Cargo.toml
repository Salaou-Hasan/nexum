[package]
name = "nx-codegen"
version = "0.4.8"
edition = "2021"
license = "MIT"

[lib]
name = "nx_codegen"
path = "src/lib.rs"

[dependencies]
nx-ast = { path = "../nx-ast" }
nx-lexer = { path = "../nx-lexer" }
nx-parser = { path = "../nx-parser" }
nx-mem = { path = "../nx-mem" }
nx-types = { path = "../nx-types" }
nx-ir = { path = "../nx-ir" }
# For the rule-driven arithmetic selector only (see `arith_plan`). HIR
# does not depend on this crate, so the arrow points one way.
nx-hir = { path = "../nx-hir" }
