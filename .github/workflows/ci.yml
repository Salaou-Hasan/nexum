name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm && echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Cross-target IR verification (host clang)
        if: runner.os == 'Linux' || runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo test --test backend ir_verifies_for_all_targets