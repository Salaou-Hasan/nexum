name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  argone-gate:
    # Argone is a hard stage gate: Stage 4 through Stage 8 stay locked
    # until every task in docs/ARGONE-STATUS.md is complete with evidence.
    #
    # This job runs the gate in report mode -- it prints the stage state and
    # must not fail, because the stage is legitimately incomplete while the
    # work is being done. It DOES run the gate's own adversarial tests, so
    # the mechanism cannot rot into something that always passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gate self-tests must pass
        shell: pwsh
        run: ./tools/argone-gate-tests.ps1
      - name: stage state
        shell: pwsh
        run: ./tools/argone-gate.ps1

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - name: type-check hello
        run: cargo run -q -p nx-driver -- check examples/hello.nx
      - name: type-check modules/main
        run: cargo run -q -p nx-driver -- check examples/modules/main.nx
      # `nx <file.nx>` compiles to a native executable and runs it; there is
      # no interpreter left to agree with, so these are smoke tests only --
      # they prove the end-to-end path works on each OS. Every example is
      # actually compiled and executed by the native job below.
      - name: build and run hello natively
        run: cargo run -q -p nx-driver -- examples/hello.nx
      - name: build and run lists natively
        run: cargo run -q -p nx-driver -- examples/lists.nx

  native:
    # nx compiles ahead of time to a native executable and does nothing else.
    # The tree-walking interpreter has been deleted, so there is no second
    # implementation left to diff against. Every gate below is therefore
    # either "this example builds, runs, exits 0 and prints something" or
    # "these two builds of the same program must agree with each other".
    env:
      # One canonical example list for every step in this job, deliberately
      # in one place. When the list was inlined per step the copies drifted
      # apart and records.nx, methods.nx and syntax.nx were left out of all
      # of them, which left records, impl/mut self, del, comprehensions,
      # slices and None with no native coverage anywhere in CI.
      EXAMPLES: >-
        examples/hello.nx examples/flex.nx examples/control.nx
        examples/funcs.nx examples/lists.nx examples/search.nx
        examples/records.nx examples/methods.nx examples/syntax.nx
        examples/modules/main.nx examples/fib.nx
        examples/unbox.nx examples/comments.nx
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: install clang (windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress
      - name: every example must build and run natively
        shell: bash
        run: |
          # nx is a compiler now. For each example: compile it to a native
          # executable, run that executable, and require a clean exit plus
          # non-empty stdout. A silent binary is a broken binary.
          for f in $EXAMPLES; do
            safe="$(echo "$f" | tr '/.' '__')"
            out="probe-$safe"
            if [ "${RUNNER_OS}" = "Windows" ]; then out="probe-$safe.exe"; fi
            cargo run -q -p nx-driver -- build "$f" -o "$out"
            rc=0
            "./$out" > got.txt || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "NONZERO EXIT $f (rc=$rc)"
              echo "--- output bytes:"; od -c got.txt | head -20
              exit 1
            fi
            if [ ! -s got.txt ]; then
              echo "NO OUTPUT $f"
              exit 1
            fi
            echo "ok $f -> $(wc -c < got.txt) bytes"
            rm -f "$out"
          done
      - name: unboxed and NX_NOUNBOX builds must agree
        shell: bash
        run: |
          # The unboxing pass must not change observable behavior, only
          # representation: same program, same output, either way. Checked
          # over every example, not a hand-picked few, because an
          # optimization pass can misfire on any construct.
          norm() { tr -d '\r' < "$1"; }
          for f in $EXAMPLES; do
            safe="$(echo "$f" | tr '/.' '__')"
            cargo run -q -p nx-driver -- build "$f" -o "un-$safe"
            NX_NOUNBOX=1 cargo run -q -p nx-driver -- build "$f" -o "bx-$safe"
            "./un-$safe" > un.txt
            "./bx-$safe" > bx.txt
            if ! diff <(norm un.txt) <(norm bx.txt); then
              echo "UNBOX MISMATCH $f"
              exit 1
            fi
          done
      - name: asan check (linux, leaks off by design)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          # Same pipeline as every other step, plus ASan via NX_CFLAGS. The
          # program must run clean: exit 0 and no sanitizer diagnostic
          # anywhere in its output. ASan writes to stderr, so capture it.
          #
          # Honest scope: clang links the ASan runtime for .ll inputs but
          # emits no load/store checks into them (measured: a volatile
          # runtime-index OOB is silent from .ll while identical C trips),
          # so this step only catches interceptor-visible libc misuse
          # (e.g. an over-long %.*s at printf time), never a heap/stack OOB
          # inside NX code. A green run is not memory-safety evidence for
          # the hand-written runtime -- see CHANGELOG.md and the Task 0
          # gate item, which stays open until coverage is real.
          for f in $EXAMPLES; do
            safe="$(echo "$f" | tr '/.' '__')"
            NX_CFLAGS="-fsanitize=address -g" cargo run -q -p nx-driver -- build "$f" -o "asan-$safe"
            rc=0
            "./asan-$safe" > got.txt 2>&1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "ASAN RUN FAILED $f (rc=$rc)"
              head -40 got.txt
              exit 1
            fi
            if grep -q 'AddressSanitizer' got.txt; then
              echo "ASAN DIAGNOSTIC $f"
              head -40 got.txt
              exit 1
            fi
            echo "asan clean $f"
            rm -f "asan-$safe"
          done
      - name: memcheck every example (linux only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          # -O1 with debug info is the recommended memcheck build: -O2
          # reuses registers in ways that blur uninit tracking, and -g
          # puts file:line on every report. Appended after the driver's
          # own -O2, so the last -O wins. Not the shipped binary; this
          # step is a memory-safety gate, not a perf run.
          NX_CFLAGS: -g -O1
        run: |
          # Valgrind Memcheck is the coverage ASan cannot give this
          # pipeline: it works on uninstrumented binaries, so the
          # hand-written runtime IR is really checked. NX never frees by
          # design, so leaks are excluded and only invalid reads/writes,
          # bad frees and uninit-dependent branches fail the gate.
          if ! command -v valgrind >/dev/null; then
            sudo apt-get update && sudo apt-get install -y valgrind
          fi
          for f in $EXAMPLES; do
            safe="$(echo "$f" | tr '/.' '__')"
            cargo run -q -p nx-driver -- build "$f" -o "mc-$safe"
            rc=0
            valgrind --tool=memcheck --error-exitcode=42 \
              --errors-for-leaks=no --track-origins=yes \
              "./mc-$safe" > mc-out.txt 2> mc-err.txt || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "MEMCHECK FAILED $f (rc=$rc)"
              tail -30 mc-err.txt
              exit 1
            fi
            echo "memcheck clean $f"
            rm -f "mc-$safe"
          done
