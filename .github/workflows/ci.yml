name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo run -q -p nx-driver -- check examples/hello.nx
      - run: cargo run -q -p nx-driver -- check examples/modules/main.nx
      - run: cargo run -q -p nx-driver -- examples/hello.nx
      - run: cargo run -q -p nx-driver -- examples/lists.nx

  native:
    # Interpreter and compiled binaries must print byte-identical output.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: install clang (windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress
      - name: interp vs native must match
        shell: bash
        run: |
          out="proberun"
          if [ "${RUNNER_OS}" = "Windows" ]; then out="proberun.exe"; fi
          for f in examples/hello.nx examples/flex.nx examples/control.nx examples/funcs.nx examples/lists.nx examples/search.nx examples/modules/main.nx; do
            cargo run -q -p nx-driver -- "$f" > want.txt
            cargo run -q -p nx-driver -- build "$f" -o "$out"
            "./$out" > got.txt
            diff want.txt got.txt || (echo "MISMATCH $f"; exit 1)
          done
