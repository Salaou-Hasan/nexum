name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo run -q -p nx-driver -- check examples/hello.nx
      - run: cargo run -q -p nx-driver -- check examples/modules/main.nx
      - run: cargo run -q -p nx-driver -- examples/hello.nx
      - run: cargo run -q -p nx-driver -- examples/lists.nx
