name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  argone-gate:
    # Argone is a hard stage gate: Stage 4 through Stage 8 stay locked
    # until every task in docs/ARGONE-STATUS.md is complete with evidence.
    #
    # This job runs the gate in report mode -- it prints the stage state and
    # must not fail, because the stage is legitimately incomplete while the
    # work is being done. It DOES run the gate's own adversarial tests, so
    # the mechanism cannot rot into something that always passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gate self-tests must pass
        shell: pwsh
        run: ./tools/argone-gate-tests.ps1
      - name: stage state
        shell: pwsh
        run: ./tools/argone-gate.ps1

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo run -q -p nx-driver -- check examples/hello.nx
      - run: cargo run -q -p nx-driver -- check examples/modules/main.nx
      - run: cargo run -q -p nx-driver -- examples/hello.nx
      - run: cargo run -q -p nx-driver -- examples/lists.nx

  native:
    # Interpreter and compiled binaries must print byte-identical output.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: install clang (windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress
      - name: interp vs native must match
        shell: bash
        run: |
          norm() { tr -d '\r' < "$1"; }
          for f in examples/hello.nx examples/flex.nx examples/control.nx examples/funcs.nx examples/lists.nx examples/search.nx examples/modules/main.nx examples/parallel.nx examples/fib.nx examples/unbox.nx examples/comments.nx; do
            safe="$(echo "$f" | tr '/.' '__')"
            out="probe-$safe"
            if [ "${RUNNER_OS}" = "Windows" ]; then out="probe-$safe.exe"; fi
            cargo run -q -p nx-driver -- "$f" > want.txt
            cargo run -q -p nx-driver -- build "$f" -o "$out"
            "./$out" > got.txt
            if ! diff <(norm want.txt) <(norm got.txt); then
              echo "MISMATCH $f"
              echo "--- want bytes:"; od -c want.txt | head -20
              echo "--- got bytes:"; od -c got.txt | head -20
              exit 1
            fi
          done
      - name: unboxed and NX_NOUNBOX builds must agree
        shell: bash
        run: |
          # The unboxing pass must not change observable behavior, only
          # representation: same program, same output, either way.
          norm() { tr -d '\r' < "$1"; }
          for f in examples/unbox.nx examples/funcs.nx examples/control.nx examples/lists.nx; do
            safe="$(echo "$f" | tr '/.' '__')"
            cargo run -q -p nx-driver -- build "$f" -o "un-$safe"
            NX_NOUNBOX=1 cargo run -q -p nx-driver -- build "$f" -o "bx-$safe"
            "./un-$safe" > un.txt
            "./bx-$safe" > bx.txt
            if ! diff <(norm un.txt) <(norm bx.txt); then
              echo "UNBOX MISMATCH $f"
              exit 1
            fi
          done
      - name: parallel must actually spawn threads
        shell: bash
        run: |
          # A parallel batch that silently ran inline would pass the
          # differential test while doing no work at all, so assert on
          # the generated IR directly.
          for f in examples/parallel.nx; do
            cargo run -q -p nx-driver -- build "$f" --emit-ir > out.ll
            if grep -q 'call ptr @nx_thread_start' out.ll; then
              echo "pool started for $f"
            else
              echo "NO THREADS for $f"
              exit 1
            fi
            if grep -q 'call void @nx_thread_join' out.ll; then
              echo "workers joined for $f"
            else
              echo "UNJOINED WORKERS for $f"
              exit 1
            fi
          done
      - name: parallel output is identical across runs
        shell: bash
        run: |
          # Threads make output order a real risk. The pool must not
          # change results, only how long they take.
          cargo run -q -p nx-driver -- build examples/parallel.nx -o par1
          cargo run -q -p nx-driver -- build examples/parallel.nx -o par2
          for i in 1 2 3 4 5 6 7 8; do
            ./par1 > "run$i.txt"
            ./par2 >> "run$i.txt"
          done
          for i in 2 3 4 5 6 7 8; do
            diff "run1.txt" "run$i.txt" || (echo "NON-DETERMINISTIC at run $i"; exit 1)
          done
          rm -f par1 par2 run*.txt
      - name: asan check (linux, leaks off by design)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          for f in examples/hello.nx examples/flex.nx examples/control.nx examples/funcs.nx examples/lists.nx examples/search.nx examples/modules/main.nx examples/parallel.nx examples/fib.nx examples/unbox.nx examples/comments.nx; do
            safe="$(echo "$f" | tr '/.' '__')"
            NX_CFLAGS="-fsanitize=address -g" cargo run -q -p nx-driver -- build "$f" -o "asan-$safe"
            ./asan-$safe > got.txt
            cargo run -q -p nx-driver -- "$f" > want.txt
            diff want.txt got.txt || (echo "MISMATCH $f"; exit 1)
          done
