name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nx-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: nx-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: nx-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: nx-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: nx-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang gcc-aarch64-linux-gnu
      - name: Install clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p nexum-driver --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/nx"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="${BIN}.exe"; fi
          cp "$BIN" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  vsix:
    # The editor extension is packaged separately from the compiler binaries.
    # It is best-effort: a failure here must not block the compiler release.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          npm install --no-audit --no-fund
          npx vsce package --no-dependencies --out ../../nexum-language.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: nexum-language.vsix
          path: nexum-language.vsix

  publish:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=""
          for f in nx-* *.vsix; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          gh release create ${{ github.ref_name }} $ASSETS --title "${{ github.ref_name }}" --notes "Nexum release ${{ github.ref_name }}"