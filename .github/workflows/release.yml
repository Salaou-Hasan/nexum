name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-nx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bits: 64
          - os: windows-latest
            target: i686-pc-windows-msvc
            bits: 32
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bits: 64
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            bits: 32
          - os: macos-latest
            target: x86_64-apple-darwin
            bits: 64
          - os: macos-latest
            target: aarch64-apple-darwin
            bits: 64-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cold release builds are the slowest part of this workflow (the
      # whole workspace, optimized, from scratch on every matrix leg),
      # which is why releases used to sit in the queue until someone
      # gave up and cancelled them. The cache is keyed per target triple
      # so the six legs do not evict each other; first run after this
      # lands is still cold, every run after it is warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nx-${{ matrix.target }}
          workspaces: .
      - name: install 32-bit C libs (linux i686)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - run: cargo build --release --locked -p nx-driver --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/nx.exe" "dist/nx-${{ github.ref_name }}-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/nx" "dist/nx-${{ github.ref_name }}-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nx-${{ matrix.target }}
          path: dist/nx-${{ github.ref_name }}-${{ matrix.target }}*

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @vscode/vsce
      - run: mkdir -p dist && vsce package --out dist/nexum-${{ github.ref_name }}.vsix
        working-directory: editors/vscode-nexum
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode-nexum/dist/*.vsix

  build-msi:
    needs: [build-nx, build-extension]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: install WiX 3.x
        # No version pin: runners pre-install newer 3.14 builds and a pin fails.
        run: choco install wixtoolset -y --no-progress
      - name: build MSIs (x64 + x86)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          WIX="C:\Program Files (x86)\WiX Toolset v3.14\bin"
          mkdir -p stage64 stage86 obj
          cp "dist/nx-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.exe" stage64/nx.exe
          cp "dist/nexum-${GITHUB_REF_NAME}.vsix" stage64/nexum.vsix
          cp "dist/nx-${GITHUB_REF_NAME}-i686-pc-windows-msvc.exe" stage86/nx.exe
          cp "dist/nexum-${GITHUB_REF_NAME}.vsix" stage86/nexum.vsix
          "$WIX/candle.exe" wix/nexum.wxs -arch x64 -dPlatform=x64 -dVersion="$VER" -dSourceDir=stage64 -out obj/nexum64.wixobj
          "$WIX/light.exe" obj/nexum64.wixobj -ext WixUIExtension -out "dist/nexum-${GITHUB_REF_NAME}-x64.msi"
          "$WIX/candle.exe" wix/nexum.wxs -arch x86 -dPlatform=x86 -dVersion="$VER" -dSourceDir=stage86 -out obj/nexum86.wixobj
          "$WIX/light.exe" obj/nexum86.wixobj -ext WixUIExtension -out "dist/nexum-${GITHUB_REF_NAME}-x86.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/*.msi

  publish-release:
    needs: [build-nx, build-extension, build-msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-marketplace:
    needs: [publish-release]
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @vscode/vsce
      # NOTE: `secrets` can't be used in `if:` (job or step); `env` can.
      - name: publish to marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: vsce publish --pat "$VSCE_PAT"
        working-directory: editors/vscode-nexum
