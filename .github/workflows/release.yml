name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nx-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: nx-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: nx-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: nx-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: nx-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang gcc-aarch64-linux-gnu
      - name: Install clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p nexum-driver --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/nx"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="${BIN}.exe"; fi
          cp "$BIN" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  vsix:
    # The editor extension is packaged separately from the compiler binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npx vsce package --no-dependencies --out ../../nexum-language.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: nexum-language.vsix
          path: nexum-language.vsix

  msi:
    # The Windows installer: the compiler, the icon and the file association,
    # and it installs the editor extension automatically.
    needs: [build, vsix]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build the compiler
        run: cargo build --release -p nexum-driver --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          name: nexum-language.vsix
      - name: Install WiX
        # The version is pinned: the interface and the PATH are done with
        # the core elements, so no WiX extension is needed, and later
        # releases ask for a maintenance-fee agreement to be accepted.
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build the MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/nx.exe" "stage/nx.exe"
          Copy-Item "packaging/windows/nexum.ico" "stage/nexum.ico"
          Copy-Item "packaging/windows/add-to-path.cmd" "stage/"
          Copy-Item "packaging/windows/install-vscode-extension.cmd" "stage/"
          Copy-Item "packaging/windows/Package.wxs" "stage/"
          Copy-Item "nexum-language.vsix" "stage/"
          Push-Location stage
          wix build Package.wxs -d NexumVersion=$version -o "../Nexum-$version-x64.msi"
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: Nexum-x64.msi
          path: Nexum-*.msi

  deb:
    # The Linux installer: the compiler, the icon and the file association,
    # and it installs the editor extension automatically.
    needs: [build, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: nx-linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: nexum-language.vsix
      - name: Build the .deb
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          root="root"
          rm -rf "$root"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" \
                   "$root/usr/share/nexum" \
                   "$root/usr/share/icons/hicolor/256x256/apps" \
                   "$root/usr/share/applications" \
                   "$root/usr/share/mime/packages"
          install -m 0755 nx-linux-x86_64 "$root/usr/bin/nx"
          install -m 0644 icon/icon-256.png "$root/usr/share/icons/hicolor/256x256/apps/nexum.png"
          install -m 0644 nexum-language.vsix "$root/usr/share/nexum/nexum-language.vsix"
          sed "s/@VERSION@/$version/g" packaging/linux/nexum.desktop.in \
            > "$root/usr/share/applications/nexum.desktop"
          install -m 0644 packaging/linux/nexum.xml.in \
            "$root/usr/share/mime/packages/nexum.xml"
          sed "s/@VERSION@/$version/g" packaging/linux/control.in > "$root/DEBIAN/control"
          sed "s/@VERSION@/$version/g" packaging/linux/postinst.in > "$root/DEBIAN/postinst"
          chmod 0755 "$root/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$root" "nexum-${version}-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: nexum-amd64.deb
          path: nexum-*.deb

  publish:
    needs: [build, vsix, msi, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=""
          for f in nx-* *.vsix *.msi *.deb; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          TAG=${{ github.ref_name }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release already exists (the tag was re-pushed): refresh the
            # assets instead of failing.
            gh release upload "$TAG" $ASSETS --clobber
            gh release edit "$TAG" --title "$TAG" --notes "Nexum release $TAG"
          else
            gh release create "$TAG" $ASSETS --title "$TAG" --notes "Nexum release $TAG"
          fi
